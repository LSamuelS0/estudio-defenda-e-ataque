<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movimento · Estúdio</title><link rel="stylesheet" href="css/estudio.css"></head><body><main class="pagina"><section class="boas-vindas"><div class="olho">Revisão quadro a quadro</div><h1>Movimento</h1><p>Escolha um personagem para abrir o visualizador e acompanhar os ciclos de animação disponíveis. Os controles de reprodução e quadros ficam junto à visualização.</p></section><section class="secao"><div class="cabecalho"><div><div class="olho">Personagens</div><h2>Escolha uma referência</h2></div></div><div class="grade" id="lista"><p class="mudo">Carregando personagens…</p></div></section></main><script src="js/armazem.js"></script><script>(async()=>{const root=document.querySelector("#lista");const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));try{const itens=await Armazem.listar();root.innerHTML=itens.map(p=>'<a class="cartao personagem" href="personagem.html?id='+encodeURIComponent(p.id)+'"><div class="arte">▶</div><div><span class="tipo">'+esc((p.categoria||"PERSONAGEM").toUpperCase())+'</span><h3>'+esc(p.nome)+'</h3><p class="mudo">Revisar animações e quadros</p><span class="selo">Abrir visualização →</span></div></a>').join("")||'<p class="mudo">Nenhum personagem cadastrado.</p>'}catch(e){root.innerHTML='<p class="mudo">'+esc(e.message)+'</p>'}})();</script></body></html>
