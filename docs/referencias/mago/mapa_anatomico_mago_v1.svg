<text x="720" y="570" class="title" font-size="22">Regras de equipamento</text>
<g class="small"><circle cx="735" cy="610" r="6" fill="#b77d2c"/><text x="755" y="615">Equipamento define área de cobertura e máscara.</text><circle cx="735" cy="650" r="6" fill="#b77d2c"/><text x="755" y="655">Armadura usa deformação menor que tecido/corpo.</text><circle cx="735" cy="690" r="6" fill="#b77d2c"/><text x="755" y="695">Âncoras acompanham o esqueleto; malha corrige curvas.</text><circle cx="735" cy="730" r="6" fill="#b77d2c"/><text x="755" y="735">Ordem de desenho controla frente, trás e sobreposição.</text><circle cx="735" cy="770" r="6" fill="#b77d2c"/><text x="755" y="775">Testar em cada direção e em poses extremas.</text></g>
<rect x="720" y="815" width="590" height="75" rx="12" fill="#efe0c7" stroke="#9b805e" stroke-width="1.5"/><text x="1015" y="845" text-anchor="middle" class="label">Importante: este SVG é um mapa esquemático inicial.</text><text x="1015" y="870" text-anchor="middle" class="small">As coordenadas finais serão calibradas com as sprites reais do mago.</text>
<text x="700" y="970" text-anchor="middle" class="small">Estúdio Defenda e Ataque • mapa vetorial editável • 1400 × 1000</text>
